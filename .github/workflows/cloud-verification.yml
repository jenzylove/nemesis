name: NEMESIS cloud verification

on:
  pull_request:
    branches:
      - verify/09492618

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09492618c7d256e2a63c16241c05f2be42c9187f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 496.0.0'
      - name: Generate ephemeral credential bridge key
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/nemesis_bridge_private.pem 2>/dev/null
          openssl pkey -in /tmp/nemesis_bridge_private.pem -pubout -out /tmp/nemesis_bridge_public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: nemesis-credential-bridge-public-key
          path: /tmp/nemesis_bridge_public.pem
          retention-days: 1
      - name: Receive encrypted development credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref='cloud-run/09492618'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/nemesis-credential.enc.json?ref=${ref//\//%2F}"
          received=0
          for attempt in $(seq 1 120); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api" -o /tmp/nemesis_credential_meta.json 2>/dev/null; then
              python - <<'PY'
import base64,json
meta=json.load(open('/tmp/nemesis_credential_meta.json'))
raw=base64.b64decode(meta['content']).decode()
bundle=json.loads(raw)
open('/tmp/nemesis_key.enc','wb').write(base64.b64decode(bundle['key_b64']))
open('/tmp/nemesis_credential.enc','wb').write(base64.b64decode(bundle['data_b64']))
PY
              openssl pkeyutl -decrypt -inkey /tmp/nemesis_bridge_private.pem -in /tmp/nemesis_key.enc -out /tmp/nemesis_aes.key -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
              openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/nemesis_credential.enc -out /tmp/nemesis-credential.json -pass file:/tmp/nemesis_aes.key
              python - <<'PY'
import json
p=json.load(open('/tmp/nemesis-credential.json'))
assert p.get('type')=='service_account'
assert p.get('project_id')=='nemesis-506114'
assert p.get('private_key') and p.get('client_email')
PY
              received=1
              break
            fi
            sleep 5
          done
          test "$received" = 1
          echo 'GOOGLE_APPLICATION_CREDENTIALS=/tmp/nemesis-credential.json' >> "$GITHUB_ENV"
      - name: Authenticate to NEMESIS staging project
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          gcloud config set project nemesis-506114 --quiet >/dev/null
          test "$(gcloud config get-value project)" = 'nemesis-506114'
      - name: Confirm exact deploy source and run backend suite
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '09492618c7d256e2a63c16241c05f2be42c9187f'
          python -m pip install -q -r backend/requirements.txt
          python -m pytest -q backend/tests
      - name: Deploy exact tested commit through Cloud Build
        run: |
          set -euo pipefail
          gcloud builds submit --project nemesis-506114 --config cloudbuild.yaml . --quiet --format='value(id)' | tee /tmp/nemesis_build_id.txt
          test -s /tmp/nemesis_build_id.txt
          gcloud run services describe nemesis-api-staging --project nemesis-506114 --region us-central1 --format=json > /tmp/nemesis_service.json
          python - <<'PY'
import json
s=json.load(open('/tmp/nemesis_service.json'))
status=s.get('status',{})
assert status.get('url')
print('deployed_revision='+str(status.get('latestReadyRevisionName','')))
print('service_url='+status['url'])
