      - name: Discover real Base verification transactions
        run: |
          set -euo pipefail
          export BASE_RPC_URL="$(gcloud secrets versions access latest --secret=nemesis-staging-base-rpc --project=nemesis-506114)"
          python - <<'PY'
import json,os,time,urllib.request
RPC=os.environ['BASE_RPC_URL']
TOPIC='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'

def rpc(method,params):
    data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
    req=urllib.request.Request(RPC,data=data,headers={'content-type':'application/json'})
    with urllib.request.urlopen(req,timeout=30) as r: payload=json.load(r)
    if payload.get('error'): raise RuntimeError(payload['error'])
    return payload.get('result')

def ok(txh):
    r=rpc('eth_getTransactionReceipt',[txh])
    return bool(r and int(r.get('status','0x0'),16)==1)

def block(n): return rpc('eth_getBlockByNumber',[hex(n),True]) or {'transactions':[]}
latest=int(rpc('eth_blockNumber',[]),16)

def delayed_native():
    for offset in (1200,1800,2600,3600,5000,7000,9000):
        start=latest-offset
        blocks={n:block(n) for n in range(start,start+61)}
        by_from={}
        for n,b in blocks.items():
            for tx in b.get('transactions') or []:
                f=str(tx.get('from') or '').lower()
                if f: by_from.setdefault(f,[]).append((n,tx))
        for b0 in range(start,start+12):
            for tx1 in blocks[b0].get('transactions') or []:
                if not tx1.get('to') or int(tx1.get('value','0x0'),16)<=0: continue
                a=tx1['to'].lower(); outs=[x for x in by_from.get(a,[]) if b0 < x[0] <= b0+40]
                if not outs or any(n<=b0+20 for n,_ in outs): continue
                n2,tx2=outs[0]
                if int(tx2.get('value','0x0'),16)<=0 or not tx2.get('to'): continue
                if not ok(tx1['hash']) or not ok(tx2['hash']): continue
                return {'chain':'base','wallet_address':tx1['from'].lower(),'theft_transaction_hash':tx1['hash'].lower(),'initial_block':b0,'recipient':a,'resume_transaction_hash':tx2['hash'].lower(),'resume_block':n2,'resume_destination':tx2['to'].lower()}
    raise RuntimeError('no delayed native multi-hop candidate found')

def pad(addr): return '0x'+'0'*24+addr[2:].lower()
def log_int(v): return int(v or '0x0',16)

def split_token():
    for offset in (1500,2500,4000,6000,9000,13000):
        start=latest-offset
        for base in range(start,start+100,10):
            logs=rpc('eth_getLogs',[{'fromBlock':hex(base),'toBlock':hex(base+4),'topics':[TOPIC]}]) or []
            for lg in logs[:250]:
                topics=lg.get('topics') or []
                if len(topics)!=3: continue
                w='0x'+topics[1][-40:].lower(); a='0x'+topics[2][-40:].lower(); amount=log_int(lg.get('data'))
                if w==a or amount<=1: continue
                b0=log_int(lg.get('blockNumber')); token=lg.get('address','').lower()
                outs=rpc('eth_getLogs',[{'fromBlock':hex(b0+1),'toBlock':hex(b0+20),'address':token,'topics':[TOPIC,pad(a)]}]) or []
                if not outs: continue
                outs.sort(key=lambda x:(log_int(x.get('blockNumber')),log_int(x.get('logIndex'))))
                first=outs[0]; n2=log_int(first.get('blockNumber')); tx2=first.get('transactionHash','').lower()
                same=[x for x in outs if x.get('transactionHash','').lower()==tx2]
                moved=sum(log_int(x.get('data')) for x in same)
                if not (moved<amount or len(same)>=2): continue
                earlier_token=rpc('eth_getLogs',[{'fromBlock':hex(b0+1),'toBlock':hex(n2),'topics':[TOPIC,pad(a)]}]) or []
                earlier_token.sort(key=lambda x:(log_int(x.get('blockNumber')),log_int(x.get('logIndex'))))
                if earlier_token and earlier_token[0].get('transactionHash','').lower()!=tx2: continue
                earlier_native=False
                for n in range(b0+1,n2+1):
                    for tx in block(n).get('transactions') or []:
                        if str(tx.get('from') or '').lower()==a and tx.get('hash','').lower()!=tx2:
                            earlier_native=True;break
                    if earlier_native: break
                if earlier_native: continue
                tx1=lg.get('transactionHash','').lower()
                if not tx1 or not ok(tx1) or not ok(tx2): continue
                return {'chain':'base','wallet_address':w,'theft_transaction_hash':tx1,'initial_block':b0,'recipient':a,'token':token,'tracked_amount':str(amount),'split_transaction_hash':tx2,'split_block':n2,'moved_amount':str(moved)}
    raise RuntimeError('no deterministic token split candidate found')

result={'delayed_native':delayed_native()}
try: result['split_token']=split_token()
except Exception as exc: result['split_token_error']=str(exc)
json.dump(result,open('/tmp/nemesis_candidates.json','w'),indent=2)
print(json.dumps(result,indent=2))
