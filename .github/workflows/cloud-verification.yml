import json,os,time,urllib.request
base=os.environ['NEMESIS_URL'].rstrip('/')
candidates=json.load(open('/tmp/nemesis_candidates.json'))

def call(path,method='GET',body=None):
    data=json.dumps(body).encode() if body is not None else None
    req=urllib.request.Request(base+path,data=data,method=method,headers={'content-type':'application/json'} if body is not None else {})
    with urllib.request.urlopen(req,timeout=300) as r:return r.status,json.load(r)

def create(c):
    status,p=call('/v1/cases','POST',{'wallet_address':c['wallet_address'],'chain':c['chain'],'theft_transaction_hash':c['theft_transaction_hash']})
    assert status==201
    assert p['agent_runtime']=='google_adk_gemini',p
    assert p['case']['finding'] is not None,p
    return p

def trace(cid): return call('/v1/cases/'+cid+'/trace')[1]
